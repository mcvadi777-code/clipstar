name: gen-keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Сгенерировать стабильный debug keystore
        run: |
          rm -f /tmp/debug.keystore
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore /tmp/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 10950 -deststoretype pkcs12
          echo "KEYSTORE_B64_START"
          base64 -w0 /tmp/debug.keystore
          echo ""
          echo "KEYSTORE_B64_END"
