name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: ClipStar
  EXPORT_PRESET: Android

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Подготовка шаблонов и SDK
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates ~/.config/godot ~/.android
          SRC="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          DST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "$SRC" ] && [ ! -d "$DST" ]; then cp -a "$SRC" "$DST"; fi
          ls -d "$DST" || echo "шаблоны не найдены"

      - name: Отладочный keystore
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -keystore ~/.android/debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi

      - name: Настройки редактора (Android SDK, JDK, keystore)
        run: |
          SDK=""
          for c in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /opt/android-sdk /usr/lib/android-sdk /opt/android-sdk-linux; do
            if [ -n "$c" ] && [ -d "$c" ] && [ -d "$c/platform-tools" -o -d "$c/tools" ]; then SDK="$c"; break; fi
          done
          echo "SDK=$SDK"
          JAVAC="$(command -v javac || true)"
          JAVA=""
          if [ -n "$JAVAC" ]; then JAVA="$(dirname "$(dirname "$(readlink -f "$JAVAC")")")"; fi
          echo "JAVA=$JAVA"
          KEYSTORE="$HOME/.android/debug.keystore"
          SETTINGS="$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$SDK\""
            echo "export/android/java_sdk_path = \"$JAVA\""
            echo "export/android/debug_keystore = \"$KEYSTORE\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$SETTINGS"
          cat "$SETTINGS"

      - name: Импорт проекта
        run: godot --headless --path . --import || true

      - name: Экспорт APK
        run: |
          mkdir -v -p build
          godot --headless --path . --export-debug "${EXPORT_PRESET}" "build/${EXPORT_NAME}.apk" || \
          godot --headless --path . --export-debug "Android" "build/${EXPORT_NAME}.apk"

      - name: Проверка результата
        run: |
          ls -lh build/
          test -f "build/${EXPORT_NAME}.apk" || (echo "APK не создан" && exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-apk
          path: build/*.apk
          retention-days: 30
